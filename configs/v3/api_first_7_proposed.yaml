panel_version: "v3.0-gate0-proposed"
created_at: "2026-09-05"
execution_mode: "api_first"

observability:
  langsmith:
    api_key_env: "LANGSMITH_API_KEY"
    tracing_env: "LANGSMITH_TRACING"
    default_tracing: false
    project_env: "LANGSMITH_PROJECT"
    default_project: "pcg-mas-v3-0-private"
  opentelemetry:
    enabled: true
    canonical_local_traces: true

providers:
  openai:
    provider_name: "openai"
    canonical_model_id: "gpt-5.6-sol"
    api_key_env: "OPENAI_API_KEY"
