provenance_contract:
  mandatory_fields:
    - provider
    - requested_model_id
    - returned_model_id
    - returned_revision
    - timestamp_utc
    - sdk_version
    - endpoint_mode
    - prompt_sha256
    - system_prompt_sha256
    - tool_schema_sha256
    - retriever_snapshot_sha256
    - reasoning_config
    - sampling_config
    - max_output
    - response_id
    - input_tokens
    - cached_input_tokens
    - reasoning_tokens
    - output_tokens
    - latency_ms
    - price_manifest_sha256
    - billed_cost_usd
    - raw_response_sha256
