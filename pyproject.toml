[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcg-mas"
version = "0.1.0"
description = "Proof-Carrying Generation for Multi-Agent Systems (research artifact)"
readme = "README.md"
requires-python = ">=3.12.13"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = ["llm", "multi-agent", "verification", "proof-carrying", "grounding"]

# Intentionally pinned at sensible bands that work on Apple Silicon (MPS) and CUDA.
dependencies = [
    # The lightweight core. Traced from actual top-level imports in src/pcg:
    # numpy (risk, responsibility, eval/audit, eval/stats, eval/tightness) and
    # scipy (lazily imported by eval/rho, eval/stats, responsibility, but required
    # at call time by core statistical functions). Nothing else is imported at
    # module level anywhere in src/pcg.
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
# --- offline reproduction of the stored 56-cell artifacts -------------------
# Adds only the plotting stack. Performs no model inference and no network I/O.
repro = [
    "matplotlib>=3.8",
]

# --- development and the full test suite -----------------------------------
# The suite imports only numpy, scipy, pytest and pcg itself.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "matplotlib>=3.8",       # figure-regeneration tests
    "ruff>=0.6",
    "mypy>=1.11",
]

# --- model execution (HEAVY, optional) --------------------------------------
# Required only to RUN experiments against real backends. Every one of these is
# imported lazily inside a function in src/pcg; none is needed to import the
# package, run the tests, or reproduce the stored artifacts.
models = [
    "torch>=2.4",
    "transformers>=4.45,<4.50",
    "accelerate>=1.0,<2.0",
    "sentence-transformers>=3.0,<6",
    "datasets>=2.20",
    "tokenizers>=0.20,<0.21",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "tiktoken>=0.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jsonschema>=4.22",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "loguru>=0.7",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "xxhash>=3.4",
]

# --- differential privacy (optional) ---------------------------------------
privacy = [
    "opacus>=1.5",
]

# --- notebooks (optional) ---------------------------------------------------
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "seaborn>=0.13",
    "colorcet>=3.1",
]

# --- frontier API adapters (optional, only if the user supplies keys) -------
frontier = [
    "openai>=1.40",
    "anthropic>=0.34",
]

# --- web-search stress tests (optional) ------------------------------------
web = [
    "duckduckgo-search>=6.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

# --- convenience: everything ------------------------------------------------
all = [
    "pcg-mas[repro,dev,models,privacy,notebooks,frontier,web]",
]

[project.scripts]
pcg = "pcg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pcg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "A", "C4", "PT", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
